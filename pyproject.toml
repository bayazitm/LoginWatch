[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loginwatch"
version = "0.1.0"
description = "A command-line tool for detecting suspicious login activity."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.16,<1",
    "rich>=14,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
loginwatch = "loginwatch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]